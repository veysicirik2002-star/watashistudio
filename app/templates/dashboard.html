<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watashi Studio | Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Patrick Hand', cursive; font-size: 19px; margin: 0; padding: 30px 18px; min-height: 100vh; color: #0f1650;
               background: linear-gradient(180deg, #0f1650, #2c4ac0); }
        .container { max-width: 1150px; margin: auto; }
        h1 { font-family: 'Bangers', cursive; font-weight: 400; letter-spacing: 1.5px; color: #ff5c8a; margin: 0; font-size: 34px; text-shadow: 2px 2px 0 #fff; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; background: #fff; border: 5px solid #ffcf3f; border-radius: 30px; padding: 14px 26px; box-shadow: 0 8px 0 #d97706; margin-bottom: 26px; }
        .btn { font-family: 'Bangers', cursive; letter-spacing: 1px; font-size: 20px; text-decoration: none; color: #fff; background: #1fb87f; border: 3px solid #fff; border-radius: 26px; padding: 4px 20px; cursor: pointer; box-shadow: 0 4px 0 #0c6b49; }
        .btn.pembe { background: #ff5c8a; box-shadow: 0 4px 0 #a3194a; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
        .stat { background: #fff; border-radius: 22px; padding: 14px 18px; border: 4px solid #6fe3c1; text-align: center; }
        .stat b { display: block; font-family: 'Bangers', cursive; font-weight: 400; font-size: 44px; color: #2c4ac0; }
        .board { background: #fff; border-radius: 30px; padding: 22px; border: 5px solid #fff; box-shadow: 0 10px 0 rgba(0,0,0,.25); overflow-x: auto; }
        .tools { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .tools input { flex: 1; min-width: 200px; padding: 10px 18px; border-radius: 20px; border: 3px solid #9fb4ff; font-family: inherit; font-size: 18px; outline: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 2px dashed #cbd5e1; vertical-align: top; }
        th { font-family: 'Bangers', cursive; font-weight: 400; letter-spacing: 1px; background: #ffcf3f; color: #5a3c00; font-size: 20px; }
        tr:hover td { background: #f0f5ff; }
        .tel { background: #dcfce7; color: #166534; padding: 2px 12px; border-radius: 14px; white-space: nowrap; }
        .sil { background: none; border: 2px solid #ff5c8a; color: #ff5c8a; border-radius: 12px; cursor: pointer; padding: 0 10px; font-size: 18px; }
        .sil:hover { background: #ff5c8a; color: #fff; }
        .bos { text-align: center; padding: 30px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top">
        <h1>🎬 WATASHI STUDIO — GELEN PROJELER</h1>
        <a class="btn" href="/">🏠 Siteye dön</a>
    </div>
    <div class="stats">
        <div class="stat"><b id="sToplam">0</b>toplam kayıt</div>
        <div class="stat"><b id="sBugun">0</b>bugün gelen</div>
        <div class="stat"><b id="sSohbet">0</b>sohbetten gelen</div>
    </div>
    <div class="board">
        <div class="tools">
            <input type="text" id="ara" placeholder="İsim, telefon veya proje içinde ara...">
            <button class="btn pembe" onclick="csvIndir()">⬇ CSV indir</button>
        </div>
        <table>
            <thead><tr><th>İsim / Marka</th><th>Telefon</th><th>Proje fikri</th><th>Tarih</th><th></th></tr></thead>
            <tbody id="tablo"></tbody>
        </table>
    </div>
</div>
<script>
let tum = [];
function k(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
async function yukle() {
    const r = await fetch('/api/leads'); const v = await r.json();
    if (!v.basari) return;
    tum = v.leads; ciz();
}
function ciz() {
    const q = document.getElementById('ara').value.toLowerCase();
    const liste = tum.filter(l => (l.isim + ' ' + l.telefon + ' ' + (l.mesaj || '')).toLowerCase().includes(q));
    const bugun = new Date().toISOString().slice(0, 10);
    document.getElementById('sToplam').textContent = tum.length;
    document.getElementById('sBugun').textContent = tum.filter(l => String(l.tarih).slice(0, 10) === bugun).length;
    document.getElementById('sSohbet').textContent = tum.filter(l => (l.mesaj || '').startsWith('[sohbet]')).length;
    const tb = document.getElementById('tablo');
    if (!liste.length) { tb.innerHTML = '<tr><td colspan="5" class="bos">Kayıt bulunamadı 🎈</td></tr>'; return; }
    tb.innerHTML = liste.map(l => '<tr><td><b>' + k(l.isim) + '</b></td><td><span class="tel">' + k(l.telefon) + '</span></td><td>' + (k(l.mesaj) || '-') + '</td><td>' + k(l.tarih) + '</td><td><button class="sil" onclick="sil(' + Number(l.id) + ')">🗑</button></td></tr>').join('');
}
async function sil(id) {
    if (!confirm('Bu kaydı silmek istediğine emin misin?')) return;
    const r = await fetch('/api/leads/' + id, { method: 'DELETE' }); const v = await r.json();
    if (v.basari) yukle(); else alert(v.hata);
}
function csvIndir() {
    const h = ['id', 'isim', 'telefon', 'mesaj', 'tarih'];
    const kac = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
    const satirlar = [h.join(',')].concat(tum.map(l => h.map(a => kac(l[a])).join(',')));
    const blob = new Blob(['﻿' + satirlar.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'watashi-leads.csv'; a.click();
}
document.getElementById('ara').addEventListener('input', ciz);
yukle();
</script>
</body>
</html>
